plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
	id 'net.neoforged.moddev' version '2.0.82'
}

version = '1.3'
group = 'suszombification'

base {
	archivesName = 'suszombification-1.21.5'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

processResources {
    exclude ".cache"
    duplicatesStrategy = 'include'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "21.5.0-alpha.1.21.6-rc1.20250613.110817"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "SusZ " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', 'suszombification', '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		suszombification {
			sourceSet(sourceSets.main)
		}
	}
}
repositories {
	maven {
		name 'Maven for PR #2297' // https://github.com/neoforged/NeoForge/pull/2297
		url 'https://prmaven.neoforged.net/NeoForge/pr2297'
		content {
			includeModule('net.neoforged', 'neoforge')
			includeModule('net.neoforged', 'testframework')
		}
	}
}
tasks.named('jar', Jar).configure {
    exclude('suszombification/datagen/**') //exclude files from the built jar that are only used to generate the assets

    manifest {
        attributes([
                "Specification-Title"     : "Suspicious Zombification",
                "Specification-Vendor"    : "Redstone_Dubstep, bl4ckscor3",
                "Specification-Version"   : "${version}",
                "Implementation-Title"    : "Suspicious Zombification",
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Redstone_Dubstep, bl4ckscor3"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
